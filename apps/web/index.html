<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f3efe7" />
    <meta name="theme-color" content="#f3efe7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#f3efe7" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-512.png" />
    <title>BPH CRM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Android paints the gesture bar from the first theme-color it sees, and
      // often leaves that bar black until the color changes again.
      addEventListener("load", function () {
        var tags = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < tags.length; i++) tags[i].setAttribute("content", "#f3efe6");
        requestAnimationFrame(function () {
          for (var i = 0; i < tags.length; i++) tags[i].setAttribute("content", "#f3efe7");
        });
      });
    </script>
  </body>
</html>
